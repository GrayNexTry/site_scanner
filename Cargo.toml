[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "signal", "process", "fs"] }
futures = "0.3"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli", "deflate", "zstd", "json", "socks"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
