[package]
name = "scanner-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HTTP API, хранилище и фоновые сканы; отдаёт встроенный веб-интерфейс"

[[bin]]
name = "maps-seo-scanner"
path = "src/main.rs"

[dependencies]
scanner-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
reqwest.workspace = true
url.workspace = true
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br", "trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rust-embed = "8"
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
# Рассылка по почте: SMTP с TLS на rustls/ring (как остальной TLS в проекте), без native-tls.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls-tls"] }
jiff = "0.2"
ring = "0.17"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
